# Traefik dynamic-provider middlewares for the vps-playground platform.
#
# NOTE: this file currently lives in the authentik repo because that's where
# the role was first wired in. As more cross-cutting middlewares accumulate
# here (redirect-to-https, future ones), it should probably move to the
# platform repo. Tracked as a follow-up in vps-control-plane/docs/identity.md.
#
# Fetched and dropped into /data/coolify/proxy/dynamic/authentik.yml by the
# `coolify_proxy_dynamic` Ansible role. Traefik watches that directory and
# reloads automatically on change.
#
# Reference names from workload labels: `<name>@file`, e.g. `authentik@file`.

http:
  middlewares:
    # Forward-auth via Authentik (domain-level mode).
    # Authentik responds with 401 + redirect when unauthenticated, or 200 +
    # X-authentik-* headers when authenticated.
    #
    # The `address` uses the container DNS name from the Authentik compose
    # (`server`). Both Authentik and the workloads must share Coolify's
    # Traefik network (Coolify attaches compose apps to it by default).
    authentik:
      forwardAuth:
        address: http://server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # HTTP → HTTPS redirect. Used by workload HTTP-side routers so plain-port-80
    # hits get bumped to HTTPS without Coolify having to manage per-app
    # redirect labels.
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
