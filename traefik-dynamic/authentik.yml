# Traefik dynamic-provider middlewares for the vps-playground platform.
#
# Fetched and dropped into /data/coolify/proxy/dynamic/authentik.yml by the
# `coolify_proxy_dynamic` Ansible role in vps-playground/vps-control-plane.
# Traefik watches that directory and reloads automatically on change.
#
# Reference names from workload labels: `<name>@file`, e.g. `authentik@file`.
#
# ⚠ PINNED BY SHA in vps-control-plane. Editing this file alone does NOT
# change what runs on the VPS. After committing changes here:
#   1. In vps-control-plane: `just bump-middleware-pin` (rewrites the SHA in
#      ansible/inventory/group_vars/all/main.yml).
#   2. Review the diff: `git diff ansible/inventory/group_vars/all/main.yml`.
#   3. `just coolify` to deploy.
# Without those steps, the VPS keeps fetching the previously-pinned commit.

http:
  routers:
    # Catch /outpost.goauthentik.io/* on ANY host before workload catch-all
    # routers can claim it. ADR-0011 §7 promises that this path is
    # intercepted on every protected hostname — the `authentik` forwardAuth
    # middleware below only makes the auth-or-deny decision; the actual
    # request still gets proxied to whatever router matched. Without this
    # router, /outpost.goauthentik.io/sign_out passes through to the
    # workload backend, which has no such route, and 404/500s.
    #
    # No middleware on this router — auth is intentionally bypassed so the
    # sign-out flow can run unauthenticated. The outpost handles its own
    # session-invalidation logic. Priority well above any host-only router
    # so this wins for matching paths.
    authentik-outpost:
      rule: 'PathPrefix(`/outpost.goauthentik.io/`)'
      priority: 1000
      entryPoints:
        - https
      tls: {}
      service: authentik-outpost

  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: http://server:9000

  middlewares:
    # Forward-auth via Authentik (domain-level mode).
    # Authentik responds with 401 + redirect when unauthenticated, or 200 +
    # X-authentik-* headers when authenticated.
    #
    # The `address` uses the container DNS name from the Authentik compose
    # (`server`). Both Authentik and the workloads must share Coolify's
    # Traefik network (Coolify attaches compose apps to it by default).
    authentik:
      forwardAuth:
        address: http://server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # HTTP → HTTPS redirect. Used by workload HTTP-side routers so plain-port-80
    # hits get bumped to HTTPS without Coolify having to manage per-app
    # redirect labels.
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
