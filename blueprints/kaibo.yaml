# Authentik blueprint for kaibo cloud: Proxy Provider + Application, fully
# open (any signed-in Authentik user can reach it). Per platform ADR-0011
# (single-application forward-auth mode).
#
# One hostname, one service: kaibo.3eee17bc.nip.io serves the web app, the
# control API and the machine surfaces from a single container. The old
# `kaibo-search` host is gone; its Provider and Application are declared
# `absent` below so the worker deletes them. Drop those two entries once
# the blueprint has applied.
#
# Auto-applied: the worker discovers this file via the /blueprints/ mount
# (docker-compose.yml) and re-applies on every change. Status visible in
# System → Blueprints.
#
# Manual one-click follow-up after first apply: bind the Application to the
# embedded outpost (Outposts → embedded → Edit → Applications tab → check
# `kaibo` → Save), and untick `kaibo-search` if it is still listed.
# Blueprints can't append to the outpost's Application list without
# replacing it, so this stays a per-workload click.
#
# Machine surfaces (/v1, /mcp, /ingest, /hooks, /healthz, /readyz) bypass
# forward-auth at the Traefik layer (routers without `authentik@file`, per
# ADR-0011 §5). The service authenticates those itself.
#
# Authorization model: NO policybinding entry. Any signed-in Authentik user
# can access kaibo; kaibo scopes data per org itself. To restrict to a named
# group later, add a `policybinding` entry (see solarscout.yaml) and make
# sure the group exists in Directory → Groups first.
#
# Unlike the sibling blueprints, kaibo verifies the X-authentik-jwt header
# rather than trusting the plain X-authentik-* headers alone, so two attrs
# are pinned on the Provider:
#   - signing_key: without it the JWT is HS256-signed with the client
#     secret and the JWKS endpoint is empty, so nothing can verify it.
#   - client_id: it is the JWT `aud`; pinning it keeps kaibo's
#     AUTHENTIK_JWT_AUDIENCE stable across provider re-creation. Not a
#     secret.

version: 1
metadata:
  name: vps-playground/kaibo
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # 1. Proxy Provider in forward-auth single-app mode.
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: kaibo
    attrs:
      authentication_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://kaibo.3eee17bc.nip.io
      mode: forward_single
      client_id: kaibo-cloud
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # 2. Application surfacing the Provider in the user dashboard.
  - model: authentik_core.application
    state: present
    identifiers:
      slug: kaibo
    attrs:
      name: Kaibo
      provider:
        !Find [authentik_providers_proxy.proxyprovider, [name, kaibo]]
      meta_launch_url: https://kaibo.3eee17bc.nip.io/app
      meta_description: Your team's engineering doctrine, served to every agent.
      policy_engine_mode: any

  # 3. Retired search-UI pair from the previous two-host layout.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: kaibo-search

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: kaibo-search
