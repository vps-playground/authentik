# Per-workload Authentik configuration template. Copy to a sibling file in
# this directory (e.g. `myapp.yaml`), replace the `<<<…>>>` placeholders,
# flip `instantiate: "false"` to `"true"`, and commit. The worker
# auto-applies on the next file-change scan.
#
# Placeholders to replace:
#   <<<WORKLOAD_SLUG>>>     e.g. myapp           (lowercase, hyphenated)
#   <<<WORKLOAD_NAME>>>     e.g. My App          (human-readable)
#   <<<WORKLOAD_HOST>>>     e.g. myapp.3eee17bc.nip.io
#   <<<REQUIRED_GROUP>>>    e.g. admins          (omit if not gating by group)
#
# If the workload is NOT admin-gated (any signed-in user allowed), DELETE
# the entire `policybinding` entry at the bottom of the entries list.
#
# Apply-time prereqs (silent-rollback footguns):
#   - Every group referenced by a policybinding must already exist in
#     Directory → Groups, otherwise the `!Find` resolves to null and the
#     whole blueprint rolls back. Symptom: status "successful",
#     managed_models empty, no entity-creation logs in the worker.
#   - All four flow slugs (default-authentication-flow,
#     default-provider-authorization-implicit-consent, and
#     default-provider-invalidation-flow) ship with Authentik out of the
#     box; only relevant if your install renamed them.
#
# After first apply succeeds, bind the new Application to the embedded
# outpost manually: Outposts → embedded outpost → Edit → Applications tab
# → check the new app → Save. Blueprints can't append to outpost
# Application lists without replacing the whole list, so this stays a
# one-click step per workload.
#
# `instantiate: "false"` on this template keeps the worker from discovering
# the placeholder body as an applyable blueprint. Real per-workload files
# must flip it to `"true"`.

version: 1
metadata:
  name: vps-playground/<<<WORKLOAD_SLUG>>>
  labels:
    blueprints.goauthentik.io/instantiate: "false"

entries:
  # 1. Proxy Provider in forward-auth single-app mode.
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: <<<WORKLOAD_SLUG>>>
    attrs:
      authentication_flow:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://<<<WORKLOAD_HOST>>>
      mode: forward_single
      # Token validity, intercept-header rules, etc. left at defaults.

  # 2. Application that surfaces the Provider in the user's dashboard
  #    and carries policy bindings.
  - model: authentik_core.application
    state: present
    identifiers:
      slug: <<<WORKLOAD_SLUG>>>
    attrs:
      name: <<<WORKLOAD_NAME>>>
      provider:
        !Find [authentik_providers_proxy.proxyprovider, [name, <<<WORKLOAD_SLUG>>>]]
      meta_launch_url: https://<<<WORKLOAD_HOST>>>
      policy_engine_mode: any

  # 3. (Optional) Group binding: require membership in <<<REQUIRED_GROUP>>>
  #    to access the Application. Delete this entry if the workload is
  #    open to any signed-in user.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target:
        !Find [authentik_core.application, [slug, <<<WORKLOAD_SLUG>>>]]
      group:
        !Find [authentik_core.group, [name, <<<REQUIRED_GROUP>>>]]
    attrs:
      enabled: true
      order: 0
