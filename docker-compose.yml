# Authentik — identity provider + forward-auth for vps-playground.
#
# Source: https://goauthentik.io/docker-compose.yml (upstream-canonical).
# Local deltas (intentional simplifications for our deployment shape):
#   - `ports:` on `server` removed; `expose:` added for 9000/9443 instead.
#     Keeps the port advertisement (Coolify reads it to build Traefik
#     routes) without binding to host ports.
#   - `./data` bind mount → named volume `authentik-data` on both `server`
#     and `worker`. Docker manages ownership; avoids host-vs-container UID
#     mismatches that crash template rendering with EACCES.
#   - `./custom-templates` mount removed: we don't override UI templates.
#   - `./certs` mount on `worker` removed: only used by the cert-management
#     feature, irrelevant for the embedded outpost we use.
#   - `/var/run/docker.sock` mount on `worker` removed: only needed to
#     spawn Docker-based outposts (we use the embedded outpost in `server`).
#   - `user: root` on `worker` removed: was only required for docker.sock
#     write access, which we no longer mount.

services:
  postgresql:
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
    - database:/var/lib/postgresql/data

  server:
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      # Cookie domain — set to the parent nip.io label for our VPS so SSO
      # cookies are shared across all <app>.3eee17bc.nip.io subdomains
      # without leaking to other nip.io users.
      # `3eee17bc` is the 8-char hex encoding of the VPS IP 62.238.23.188.
      AUTHENTIK_COOKIE_DOMAIN: ${AUTHENTIK_COOKIE_DOMAIN:-3eee17bc.nip.io}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.2.2}
    restart: unless-stopped
    shm_size: 512mb
    expose:
    - "9000"
    - "9443"
    volumes:
    - authentik-data:/data

  worker:
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.2.2}
    restart: unless-stopped
    shm_size: 512mb
    volumes:
    - authentik-data:/data

volumes:
  database:
    driver: local
  authentik-data:
    driver: local
